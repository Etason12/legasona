<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/legasona_fav_icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Legasona ERP - Vehicle & Spare Parts Dealership Management" />

    <!-- Preconnect to API backend -->
    <link rel="preconnect" href="https://legasonaimporter.onrender.com" crossorigin />

    <!-- Preload critical CSS -->
    <link rel="preload" href="/src/index.css" as="style" />

    <!-- DNS prefetch for API (fallback for preconnect) -->
    <link rel="dns-prefetch" href="https://legasonaimporter.onrender.com" />

    <title>Legasona ERP</title>
    <script>
      const theme = localStorage.getItem('theme') || 'light';
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
  </head>
  <body class="bg-white text-gray-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
